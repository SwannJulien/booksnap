spring.application.name=booksnap-backend

# PostgreSQL Configuration
# stringtype=unspecified : sans lui, le pilote envoie les paramètres de
# setString() typés `varchar`, et PostgreSQL résout alors `citext = varchar` en
# comparaison `text` — sensible à la casse. La colonne users.email a beau être
# sur le domaine `email` (citext) depuis V4, la recherche par email redeviendrait
# sensible à la casse. Avec `unspecified`, le paramètre part non typé et le
# serveur l'infère en citext. Vérifié : varchar -> 0 ligne, inféré -> 1 ligne.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}?stringtype=unspecified
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# HikariCP Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Flyway Configuration
# Flyway est la SEULE autorité sur le schéma. Les migrations vivent dans
# src/main/resources/db/migration, nommées V<n>__<description>.sql.
spring.flyway.enabled=true
# La base en service existe déjà et contient V1 (schéma) et V2 (Dewey) :
# baseline-version=2 les marque comme acquises et empêche de les y rejouer.
# Flyway ignore toute migration dont la version est <= baseline-version.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# JPA Configuration
# `validate` et non `update` : Hibernate vérifie que les entités correspondent
# au schéma, sans jamais le modifier hors de tout versionnement.
# Si la validation bloque, basculer temporairement sur `none` — jamais `update`,
# qui remettrait Hibernate à modifier le schéma dans le dos de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Pagination Configuration
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.page-serialization-mode=VIA_DTO

# Slf4j Configuration
logging.level.root=INFO
logging.level.net.booksnap=DEBUG

# Cover Configuration
# Covers are stored as bytea in the `cover` table; this caps what a single upload may write.
booksnap.cover.max-size-bytes=2097152

# BCrypt Configuration
# Cost factor used to hash and verify passwords: each increment doubles the work.
# That cost is the protection against offline cracking of a stolen hash, so it is
# tunable per environment but never lowered to make logins or tests feel faster.
# 10 is around 100 ms per attempt; the encoder rejects anything outside [4, 31].
booksnap.security.bcrypt-strength=10

# Session Configuration
# Sessions live in Tomcat's memory: they are lost on every restart, and they would
# not be shared if a second instance were ever deployed (that would call for
# spring-session-jdbc). Acceptable while a single instance serves the school.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Driven by the environment on purpose: hard-coded to true it breaks plain-HTTP
# development, hard-coded to false it ships to production.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Idle timeout, not an absolute lifetime: a day at the desk without having to log
# back in mid-afternoon.
server.servlet.session.timeout=8h
